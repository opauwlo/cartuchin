name: Core DS (DeSmuME-wasm melhorado)

# Compila ds/nds*.js + ds/nds*.wasm a partir do 44670/desmume-wasm + ds/core/desmume.patch,
# testa e commita em ds/. Só roda quando o core muda (ou manualmente).
# Economia: ccache guarda os objetos compilados; mudança pequena = build de ~1-2 min.
on:
  push:
    branches: [main]
    paths:
      - "ds/core/**"
      - ".github/workflows/ds-core.yml"
  workflow_dispatch:
    inputs:
      diagnostico:
        description: "Gerar build de diagnóstico (exceções com stack trace)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: ds-core
  cancel-in-progress: true

env:
  UPSTREAM: https://github.com/44670/desmume-wasm
  UPSTREAM_REF: 1015846
  EMSDK_VERSION: 3.1.74
  CCACHE_DIR: /home/runner/.cache/ccache
  CCACHE_MAXSIZE: 400M
  CCACHE_COMPILERCHECK: content

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Dependências
        run: |
          sudo apt-get install -y --no-install-recommends ccache zlib1g-dev >/dev/null
          mkdir -p "$CCACHE_DIR" logs

      - name: Cache do ccache
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-${{ env.EMSDK_VERSION }}-${{ hashFiles('ds/core/desmume.patch', 'ds/core/build.sh') }}
          restore-keys: ccache-${{ env.EMSDK_VERSION }}-

      - name: Baixar upstream e aplicar patch
        run: |
          set -euo pipefail
          git clone --quiet --filter=blob:none "$UPSTREAM" up
          git -C up checkout --quiet "$UPSTREAM_REF"
          git -C up apply "$GITHUB_WORKSPACE/ds/core/desmume.patch"
          cp ds/core/build.sh up/build.sh
          cp -r ds/core/tools up/tools
          chmod +x up/build.sh

      - name: Teste nativo (áudio + save state)
        working-directory: up
        run: |
          set -euo pipefail
          CCACHE=1 NATIVE_CHECK=1 ./build.sh > ../logs/native-build.log 2>&1 || { tail -20 ../logs/native-build.log | sed 's/^/::error::/'; exit 1; }
          python3 tools/testrom/make_tone_rom.py tone.nds
          timeout 120 .obj-native/nds-native tone.nds 600 > ../logs/native-test.log 2>&1 || true
          grep -q '^PASSOU$' ../logs/native-test.log || { tail -5 ../logs/native-test.log | sed 's/^/::error::/'; exit 1; }

      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: ${{ env.EMSDK_VERSION }}
          actions-cache-folder: emsdk-cache

      - name: Build wasm (sem SIMD, com SIMD e com threads)
        working-directory: up
        run: |
          set -uo pipefail
          CCACHE=1 SIMD=0 OUT=dist ./build.sh > ../logs/build-nosimd.log 2>&1 || { grep -iE "error|ERRO" ../logs/build-nosimd.log | head -10 | sed 's/^/::error::/'; exit 1; }
          if ! CCACHE=1 SIMD=1 OUT=dist ./build.sh > ../logs/build-simd.log 2>&1; then
            echo "::warning::Build SIMD falhou; publicando só a versão sem SIMD"
            cp dist/nds-nosimd.js dist/nds.js
            cp dist/nds-nosimd.wasm dist/nds.wasm
          fi
          # threads (3D em paralelo): opcional; sem ele a página usa o core sem threads
          # threads: desligado até o patch experimental (ds/core/experimental) ser testado em jogo
          if [ "${BUILD_MT:-0}" = 1 ] && ! CCACHE=1 SIMD=1 MT=1 OUT=dist ./build.sh > ../logs/build-mt.log 2>&1; then
            echo "::warning::Build com threads falhou"
            grep -iE "error|ERRO" ../logs/build-mt.log | head -8 | sed 's/^/::warning::MT /' || true
          fi
          ccache -s | tail -4 || true

      - name: Teste do wasm no Node
        id: nodetest
        working-directory: up
        run: |
          set -uo pipefail
          worst=0
          for n in nds nds-nosimd; do
            node tools/node-test.cjs dist "$n" tone.nds > "../logs/node-$n.log" 2>&1; code=$?
            tail -1 "../logs/node-$n.log" | sed "s/^/::notice::$n: /"
            (( code > worst )) && worst=$code
          done
          grep -h "media=\|THROW" ../logs/node-*.log | head -4 | sed 's/^/::notice::/' || true
          echo "code=$worst" >> "$GITHUB_OUTPUT"
          # 1 = áudio/vídeo quebrados: não publica. 2 = só o save state: publica com aviso.
          [ "$worst" = 2 ] && echo "::warning::Save state ainda falha no wasm"
          [ "$worst" != 1 ]

      # Canal de teste: core com o patch ds/core/desmume-test.patch (resolução interna 2x+, etc.).
      # Não bloqueia o estável; o app só usa quando a pessoa escolhe "Core: teste".
      - name: Core de teste
        id: testcore
        continue-on-error: true
        run: |
          set -euo pipefail
          [ -s ds/core/desmume-test.patch ] || { echo "sem patch de teste"; exit 0; }
          git clone --quiet --filter=blob:none "$UPSTREAM" uptest
          git -C uptest checkout --quiet "$UPSTREAM_REF"
          git -C uptest apply "$GITHUB_WORKSPACE/ds/core/desmume-test.patch"
          cp ds/core/build.sh uptest/build.sh && cp -r ds/core/tools uptest/tools && chmod +x uptest/build.sh
          cd uptest
          CCACHE=1 TEST=1 SIMD=1 OUT=dist ./build.sh > ../logs/build-test.log 2>&1 || { tail -15 ../logs/build-test.log | sed 's/^/::warning::TESTE /'; exit 1; }
          python3 tools/testrom/make_tone_rom.py tone.nds > /dev/null
          set +e
          node tools/node-test.cjs dist nds-test tone.nds > ../logs/node-test-core.log 2>&1; code=$?
          set -e
          tail -1 ../logs/node-test-core.log | sed 's/^/::notice::nds-test: /'
          [ "$code" != 1 ]

      # Core de teste com threads (ds/nds-test-mt): o 3D em software roda em outros núcleos.
      # Só funciona na página isolada do DS (?ds=, cabeçalhos COOP/COEP na Vercel).
      - name: Core de teste com threads
        id: mtcore
        if: steps.testcore.outcome == 'success'
        continue-on-error: true
        working-directory: uptest
        run: |
          set -euo pipefail
          CCACHE=1 TEST=1 MT=1 SIMD=1 OUT=dist ./build.sh > ../logs/build-test-mt.log 2>&1 || { tail -15 ../logs/build-test-mt.log | sed 's/^/::warning::TESTE MT /'; exit 1; }
          ls -la dist/nds-test-mt.*

      # Core de teste + JIT de ARM para WebAssembly (ds/nds-jit). Só publica se, no Node,
      # o JIT der exatamente as mesmas imagens que o interpretador.
      - name: Core JIT
        id: jitcore
        if: steps.testcore.outcome == 'success'
        continue-on-error: true
        working-directory: uptest
        run: |
          set -euo pipefail
          # 1) fase B: cada instrução emitida em wasm direto contra o interpretador nativo
          sudo apt-get install -y --no-install-recommends libegl-dev libgles-dev >/dev/null
          CCACHE=1 TEST=1 JIT=1 NATIVE_CHECK=1 NATIVE_OPT=1 ./build.sh > ../logs/build-jit-native.log 2>&1 || { tail -15 ../logs/build-jit-native.log | sed 's/^/::warning::JIT nativo /'; exit 1; }
          .obj-native-O1-test-jit/nds-jitfuzz fuzz.json 30000 > ../logs/jit-fuzz.log
          node tools/jit-fuzz.cjs fuzz.json >> ../logs/jit-fuzz.log 2>&1 || { tail -16 ../logs/jit-fuzz.log | sed 's/^/::warning::FUZZ /'; exit 1; }
          tail -2 ../logs/jit-fuzz.log | head -1 | sed 's/^/::notice::JIT fase B: /'
          # 2) ROMs inteiras: JIT e interpretador têm de dar as mesmas imagens
          CCACHE=1 TEST=1 JIT=1 SIMD=1 OUT=dist ./build.sh > ../logs/build-jit.log 2>&1 || { tail -15 ../logs/build-jit.log | sed 's/^/::warning::JIT /'; exit 1; }
          cp "$GITHUB_WORKSPACE/cputorture.nds" ct.nds
          cp tools/roms/*.nds .
          ok=1
          for rom in tone.nds ct.nds bench3d-arm.nds bench3d-thumb.nds scene3d-arm.nds scene3d-thumb.nds; do
            if timeout 600 node tools/node-jit.cjs dist nds-jit "$rom" 600 > "../logs/jit-$rom.log" 2>&1; then :; else ok=0; fi
            grep -E "ms/quadro|ABORT|Error" "../logs/jit-$rom.log" | head -3 | sed 's/^/::notice::JIT /' || true
          done
          [ "$ok" = 1 ]

      - name: Build de diagnóstico
        if: inputs.diagnostico || failure()
        working-directory: up
        run: |
          set -uo pipefail
          CCACHE=1 DEBUG=1 SIMD=0 OUT=dbg ./build.sh > ../logs/debug-build.log 2>&1 || { tail -15 ../logs/debug-build.log | sed 's/^/::error::DBG /'; exit 1; }
          node tools/node-test.cjs dbg nds-debug tone.nds > ../logs/debug-run.log 2>&1 || true
          grep -A12 "THROW" ../logs/debug-run.log | head -12 | sed 's/^/::warning::/' || true
          cp dbg/nds-debug.js dbg/nds-debug.wasm ../logs/

      - name: Commitar o core em ds/
        if: success()
        run: |
          set -euo pipefail
          for f in nds.js nds.wasm nds-nosimd.js nds-nosimd.wasm; do
            test -s "up/dist/$f" || { echo "::error::faltou $f"; exit 1; }
            cp "up/dist/$f" "ds/$f"
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for f in nds-mt.js nds-mt.wasm; do if [ -s "up/dist/$f" ]; then cp "up/dist/$f" "ds/$f"; fi; done
          if [ "${{ steps.testcore.outcome }}" = success ]; then
            for f in nds-test.js nds-test.wasm; do if [ -s "uptest/dist/$f" ]; then cp "uptest/dist/$f" "ds/$f"; git add "ds/$f"; fi; done
          fi
          if [ "${{ steps.mtcore.outcome }}" = success ]; then
            for f in nds-test-mt.js nds-test-mt.wasm; do if [ -s "uptest/dist/$f" ]; then cp "uptest/dist/$f" "ds/$f"; git add "ds/$f"; fi; done
          fi
          if [ "${{ steps.jitcore.outcome }}" = success ]; then
            for f in nds-jit.js nds-jit.wasm; do if [ -s "uptest/dist/$f" ]; then cp "uptest/dist/$f" "ds/$f"; git add "ds/$f"; fi; done
          fi
          git add ds/nds.js ds/nds.wasm ds/nds-nosimd.js ds/nds-nosimd.wasm
          git add ds/nds-mt.js ds/nds-mt.wasm 2>/dev/null || true
          if git diff --cached --quiet; then echo "core igual, nada a commitar"; exit 0; fi
          git commit -m "ds: core compilado (${GITHUB_SHA::7}) [skip ci]"
          for i in 1 2 3; do
            git pull --rebase --quiet origin main && git push origin HEAD:main && exit 0
            sleep 5
          done
          exit 1

      # O log do Actions nem sempre dá para baixar de fora: logs (e o build de
      # diagnóstico, se houver) vão para a branch ds-ci-logs, sobrescrita a cada execução.
      - name: Publicar logs
        if: always()
        run: |
          set -u
          auth=$(git config --get http.https://github.com/.extraheader || true)
          cd logs || exit 0
          echo "run ${GITHUB_RUN_ID} sha ${GITHUB_SHA} $(date -u +%FT%TZ)" > RUN.txt
          git init -q && git checkout -q -b ds-ci-logs && git add -A
          git -c user.name=ci -c user.email=ci@local commit -qm "logs ${GITHUB_RUN_ID}"
          git -c http.extraheader="$auth" push -qf "https://github.com/${GITHUB_REPOSITORY}" ds-ci-logs || echo "::warning::não publiquei os logs"
