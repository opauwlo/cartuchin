name: Teste do DS (jogo, save state, segunda tela)

# Roda quando muda algo do app ou do core publicado. Uma execução por vez: um push novo cancela a anterior.
on:
  push:
    branches: [main]
    paths:
      - "app.js"
      - "index.html"
      - "ds/*.js"
      - "ds/*.wasm"
      - "tests/ds-e2e.mjs"
      - ".github/workflows/ds-e2e.yml"
  workflow_dispatch:

concurrency:
  group: ds-e2e
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Core estável 1x
        run: node tests/ds-e2e.mjs
      - name: Core de teste + JIT 6x (segunda tela no limite)
        run: node tests/ds-e2e.mjs
        env:
          CORE: jit
          SCALE: "6"
