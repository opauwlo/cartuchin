name: Teste do DS e do GBA (jogo, save state, segunda tela)

# Roda quando muda algo do app ou do core publicado. Uma execução por vez: um push novo cancela a anterior.
on:
  push:
    branches: [main]
    paths:
      - "app.js"
      - "index.html"
      - "ds/*.js"
      - "ds/*.wasm"
      - "tests/ds-e2e.mjs"
      - "tests/gba-e2e.mjs"
      - "vendor/rcheevos.*"
      - "api/ra.js"
      - "tests/ra-api.mjs"
      - "tests/make_gba_test_rom.py"
      - ".github/workflows/ds-e2e.yml"
  workflow_dispatch:

concurrency:
  group: ds-e2e
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Ponte do RetroAchievements (/api/ra)
        run: set -o pipefail; node tests/ra-api.mjs 2>&1 | tee out.log || { grep -E -A4 '^FALHA|Error' out.log | head -30 | sed 's/^/::error::/'; exit 1; }
      - name: GBA (jogo, botões, save, estados, segunda tela pixels e console)
        run: set -o pipefail; node tests/gba-e2e.mjs 2>&1 | tee out.log || { grep -E -A4 '^FALHA|Error' out.log | head -30 | sed 's/^/::error::/'; exit 1; }
      - name: Core estável 1x (segunda tela em todos os formatos e arrumações)
        run: set -o pipefail; node tests/ds-e2e.mjs 2>&1 | tee out.log || { grep -E -A4 '^FALHA|Error' out.log | head -30 | sed 's/^/::error::/'; exit 1; }
      - name: Core de teste + JIT 6x (segunda tela no limite)
        run: set -o pipefail; node tests/ds-e2e.mjs 2>&1 | tee out.log || { grep -E -A4 '^FALHA|Error' out.log | head -30 | sed 's/^/::error::/'; exit 1; }
        env:
          CORE: jit
          SCALE: "6"
          CAST_MODES: "0"
          CAST_LAYOUTS: top
      - name: Core de teste com threads (página isolada)
        run: set -o pipefail; node tests/ds-e2e.mjs 2>&1 | tee out.log || { grep -E -A4 '^FALHA|Error' out.log | head -30 | sed 's/^/::error::/'; exit 1; }
        env:
          CORE: mt
          CAST_MODES: "0"
          CAST_LAYOUTS: top
