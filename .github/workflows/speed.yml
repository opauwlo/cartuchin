name: Teste de velocidade

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # to comment the result on the commit when the test fails

jobs:
  speed:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - name: Teste de velocidade
        run: npm run test:speed
        env:
          SUMMARY_FILE: speed-summary.md
      - name: Comentar o resultado no commit
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -f speed-summary.md ] || echo "O teste de velocidade não chegou a gerar resultado. Veja o log da execução." > speed-summary.md
          gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" -F body=@speed-summary.md
