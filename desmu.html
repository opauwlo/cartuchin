<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DeSmuME-wasm Melhorado - Áudio Limpo</title>
    <style>
        body, html {
            margin: 0; padding: 0; background-color: #000;
            height: 100%; overflow: hidden;
            font-family: sans-serif; color: #fff;
        }
        #game-container { width: 100%; height: 100%; display: flex; flex-direction: column; }
        #game { flex-grow: 1; width: 100%; }
        .status-bar {
            background: #222; padding: 8px 12px; font-size: 12px;
            display: flex; justify-content: space-between;
            border-bottom: 1px solid #333;
        }
        .status-item { color: #4CAF50; }
        .status-item.warn { color: #FFC107; }
        .status-item.error { color: #F44336; }
    </style>
</head>
<body>
    <div id="game-container">
        <div class="status-bar">
            <span id="status-audio" class="status-item">Áudio: Inicializando...</span>
            <span id="status-perf" class="status-item">Performance: --</span>
        </div>
        <div id="game"></div>
    </div>

    <script>
        // ============================================================
        // CONFIGURAÇÃO DO EMULATORJS (Core: DeSmuME)
        // ============================================================
        EJS_player = '#game';
        EJS_core = 'nds';
        EJS_pathtodata = 'https://cdn.emulatorjs.org/stable/data/';
        EJS_language = 'pt-BR';
        EJS_disableAutoLang = true;
        EJS_gameName = 'Meu Jogo NDS';

        // ============================================================
        // OTIMIZAÇÕES DE ÁUDIO PARA DESMUME-WASM
        // ============================================================
        // O WebAudio no browser tem latência alta. Forçamos um buffer
        // maior que o padrão para evitar estalos (crackling) e stutter.
        (function() {
            const originalAudioContext = window.AudioContext || window.webkitAudioContext;
            if (!originalAudioContext) return;

            window.AudioContext = window.webkitAudioContext = function(...args) {
                const ctx = new originalAudioContext(...args);
                
                // Aumenta o buffer de saída do hardware de áudio.
                // O valor base é geralmente 512. 2048 dá uma folga segura
                // para o WASM processar os samples sem perder frames.
                try {
                    // Alguns browsers permitem alterar o baseLatency via
                    // propriedades internas, mas o mais confiável é
                    // garantir que o emulador use um buffer grande.
                    // O EmulatorJS/DeSmuME geralmente usa ScriptProcessorNode,
                    // então precisamos de um buffer que aguente a latência.
                    
                    // Forçamos a criação de um ScriptProcessorNode com buffer
                    // maior, interceptando o createScriptProcessor.
                    const originalCreateScriptProcessor = ctx.createScriptProcessor;
                    ctx.createScriptProcessor = function(bufferSize, inputChannels, outputChannels) {
                        // Buffer mínimo de 2048. Se o emulador pedir algo menor,
                        // sobrescrevemos para evitar sub-run do WASM.
                        const safeBufferSize = Math.max(bufferSize || 2048, 2048);
                        console.log(`[Áudio] ScriptProcessorNode: buffer original ${bufferSize}, forçado para ${safeBufferSize}`);
                        return originalCreateScriptProcessor.call(ctx, safeBufferSize, inputChannels, outputChannels);
                    };

                    // Atualiza o status visual
                    const statusEl = document.getElementById('status-audio');
                    if (statusEl) statusEl.textContent = 'Áudio: Buffer otimizado (2048)';
                } catch (e) {
                    console.warn('[Áudio] Não foi possível otimizar o buffer:', e);
                    const statusEl = document.getElementById('status-audio');
                    if (statusEl) {
                        statusEl.textContent = 'Áudio: Otimização falhou';
                        statusEl.className = 'status-item warn';
                    }
                }

                return ctx;
            };
        })();

        // ============================================================
        // OTIMIZAÇÃO DE PERFORMANCE: FRAME SKIP DINÂMICO
        // ============================================================
        // Se o frame rate cair, ativamos um skip de 1 frame para
        // manter o áudio estável. O stutter de áudio é quase sempre
        // causado por frames perdidos.
        (function() {
            let lastTime = performance.now();
            let frameCount = 0;
            let fps = 60;
            let skipMode = false;

            const statusEl = document.getElementById('status-perf');

            function checkPerformance() {
                const now = performance.now();
                frameCount++;

                if (now - lastTime >= 1000) {
                    fps = Math.round((frameCount * 1000) / (now - lastTime));
                    frameCount = 0;
                    lastTime = now;

                    if (statusEl) {
                        statusEl.textContent = `Performance: ${fps} FPS`;
                        statusEl.className = fps < 45 ? 'status-item error' : 'status-item';
                    }

                    // Se o FPS estiver abaixo de 50, ativamos skip de frame
                    // para aliviar a carga e evitar stutter de áudio.
                    if (fps < 50 && !skipMode) {
                        skipMode = true;
                        console.log('[Performance] Modo de skip ativado (FPS baixo)');
                        // O EmulatorJS expõe a função de skip via EJS_emulator
                        if (window.EJS_emulator && window.EJS_emulator.gameManager) {
                            window.EJS_emulator.gameManager.setFrameSkip(1);
                        }
                    } else if (fps >= 55 && skipMode) {
                        skipMode = false;
                        console.log('[Performance] Modo de skip desativado (FPS recuperado)');
                        if (window.EJS_emulator && window.EJS_emulator.gameManager) {
                            window.EJS_emulator.gameManager.setFrameSkip(0);
                        }
                    }
                }
                requestAnimationFrame(checkPerformance);
            }

            // Inicia o monitoramento após o carregamento
            window.addEventListener('load', () => {
                setTimeout(() => {
                    requestAnimationFrame(checkPerformance);
                }, 5000); // Espera 5 segundos para o emulador estabilizar
            });
        })();

        // ============================================================
        // INSTRUÇÕES PARA O USUÁRIO
        // ============================================================
        window.addEventListener('load', () => {
            setTimeout(() => {
                const gameElement = document.getElementById('game');
                if (!gameElement || gameElement.children.length === 0) {
                    alert("Bem-vindo ao DeSmuME-wasm Melhorado!\n\n" +
                          "1. Selecione o arquivo da sua ROM (.nds).\n" +
                          "2. Se solicitado, selecione as BIOS (bios7.bin, bios9.bin, firmware.bin).\n" +
                          "3. Para melhor performance, feche outros aplicativos.\n\n" +
                          "O áudio foi otimizado automaticamente. Se ainda houver ruído, " +
                          "desative o Modo de Baixo Consumo do seu celular.");
                }
            }, 1000);
        });
    </script>

    <script src="https://cdn.emulatorjs.org/stable/data/loader.js"></script>
</body>
</html>
