<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Teste de DS · Cartuchin</title>
<style>
  :root { --bg: #0f1220; --ink: #e9ebf2; --muted: #9aa0b8; --accent: #7c8bff; --line: #262b40; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.45 system-ui, sans-serif; }
  main { max-width: 520px; margin: 0 auto; padding: 20px 16px 40px; }
  h1 { font-size: 1.4rem; margin: 0 0 6px; }
  p { color: var(--muted); margin: 0 0 14px; }
  .card { border: 1px solid var(--line); border-radius: 14px; padding: 16px; margin-bottom: 14px; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; }
  button, .file { font: inherit; border: 1px solid var(--line); background: #1a1f33; color: var(--ink); border-radius: 10px; padding: 10px 14px; }
  button.on { border-color: var(--accent); background: #232a4d; }
  button.primary { background: var(--accent); color: #0d1020; border-color: var(--accent); font-weight: 700; width: 100%; padding: 12px; }
  button:disabled { opacity: 0.45; }
  .file { display: block; text-align: center; }
  .file input { display: none; }
  #romName { font-size: 0.9rem; margin-top: 8px; }
  #game { width: 100%; height: 62vh; background: #000; border-radius: 10px; overflow: hidden; }
  #status { margin: 12px 0; color: var(--ink); }
  #result { font-size: 1.1rem; line-height: 1.7; }
  #result small { color: var(--muted); font-size: 0.85rem; }
</style>
</head>
<body>
<main>
  <section id="setup">
    <h1>Teste de DS</h1>
    <p>Mede se este celular roda um jogo de Nintendo DS na velocidade certa, antes de criarmos o modo DS. O jogo fica só aqui, nada é enviado.</p>
    <div class="card">
      <label class="file">Escolher o jogo (.nds ou .zip)<input id="romInput" type="file" accept=".nds,.zip"></label>
      <p id="romName"></p>
      <p id="isoNote" style="font-size:0.85rem"></p>
      <p style="margin:12px 0 8px">Emulador:</p>
      <div class="row">
        <button type="button" data-core="melonds" class="on">melonDS</button>
        <button type="button" data-core="melonds-thread">melonDS com threads</button>
        <button type="button" data-core="desmume2015">DeSmuME 2015</button>
        <button type="button" data-core="melonds-prof">melonDS Cartuchin (medidor)</button>
      </div>
    </div>
    <button id="startBtn" class="primary" type="button" disabled>Abrir o jogo</button>
  </section>
  <section id="run" hidden>
    <div id="game"></div>
    <p id="status"></p>
    <button id="measure" class="primary" type="button" disabled>Medir</button>
    <div id="result" class="card" hidden></div>
  </section>
</main>
<script src="teste-ds.js?v=20261012215836"></script>
</body>
</html>
